<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano Banana Flow</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="lib/watermark.js"></script>
</head>

<body>
  <div class="background-layer"></div>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <!-- Theme Image (Small, Top-Right) -->
      <div class="header-banana">
        <img src="images/nano_banana_theme_bg.webp" alt="Nano Banana Theme" class="header-image">
      </div>

      <div class="logo-area">
        <h1 class="title-en">
          Nano Banana Flow
        </h1>
        <h2 class="title-cn">
          大香蕉批量生图神器
          <span class="version-badge">v2.0.1</span>
        </h2>
      </div>

      <!-- Status Indicator -->
      <div id="statusIndicator" class="status-indicator">
        <span class="dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Directory Input -->
      <div class="input-group">
        <label for="directoryInput">
          <span class="icon">📂</span> 保存目录 (默认为浏览器下载目录)
        </label>
        <div class="directory-row">
          <input type="text" id="directoryInput" placeholder="例如: my-project/slide1"
            class="glass-input directory-input">
          <button id="selectDirBtn" class="tool-btn icon-only-small" data-tooltip-below="选择目录">📁</button>
          <button id="settingsBtn" class="tool-btn icon-only-small" data-tooltip-below="API 设置">⚙️</button>
        </div>
      </div>

      <!-- Prompts Input -->
      <div class="input-group prompt-group">
        <label for="promptInput">
          <div class="label-with-actions">
            <div class="import-tools">
              <button id="importTxtBtn" class="tool-btn icon-only" data-tooltip="导入提示词文件 (.txt)">📄</button>
              <button id="importImagesBtn" class="tool-btn icon-only" data-tooltip="导入参考图片">🖼️</button>
              <button id="promptEnhanceBtn" class="tool-btn icon-only" data-tooltip="AI 提示词增强">✨</button>
              <button id="promptLibraryBtn" class="tool-btn icon-only" data-tooltip="提示词库">📚</button>
              <button id="savePromptBtn" class="tool-btn icon-only" data-tooltip="保存当前提示词">💾</button>
            </div>
          </div>
        </label>
        <textarea id="promptInput" class="glass-input prompt-textarea" placeholder="在此输入提示词，支持文本和 JSON 格式批量生图。

📝 分隔方式升级：支持 --- 、||| 、⸻ 三种分隔符

✨ v2.0 新增：AI优化提示词、一键去水印、点选上传参考图"></textarea>
        <!-- Progress Section (Relocated) -->
        <div id="progressArea" class="progress-section hidden">
          <div class="progress-info">
            <span id="currentStatus">正在生成...</span>
            <span id="progressCount">0/0</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
        </div>
        <div id="promptCount" class="prompt-count">0 条提示词已被识别，随时可以开始</div>
        <div id="matchStatus" class="match-status hidden">已关联 0 张参考图</div>
        <div id="matchDetails" class="match-details hidden"></div>
        <!-- Prompt Blocks Container (New) -->
        <div id="promptBlocksContainer" class="prompt-blocks-container hidden"></div>

        <!-- Hidden Inputs -->
        <input type="file" id="txtFileInput" accept=".txt" style="display: none;">
        <input type="file" id="imageFileInput" accept="image/*" multiple style="display: none;">
        <input type="file" id="folderInput" webkitdirectory directory style="display: none;">
        <input type="file" id="manualWatermarkInput" accept="image/*" multiple style="display: none;">
        <input type="file" id="manualImageInput" accept="image/*" multiple style="display: none;">
      </div>

      <!-- Action Area -->
      <div class="action-area">
        <button id="actionBtn" class="btn-gold">
          <span class="btn-icon">🎨</span>
          <span class="btn-text">批量生成</span>
        </button>
        <button id="openLabBtn" class="btn-wr">
          <span class="btn-icon">⚡</span>
          <span class="btn-text">去水印</span>
        </button>
        <button id="clearBtn" class="btn-secondary" data-tooltip="清空提示词">
          <span class="btn-icon">🗑️</span>
          <span class="btn-text">清空</span>
        </button>
      </div>
      <div id="labStatus" class="lab-status hidden">正在处理: 0/0</div>



      <!-- Error Message -->
      <div id="errorMsg" class="error-card hidden"></div>

      <!-- Watermark Prompt Modal -->
      <div id="watermarkModal" class="modal-overlay hidden">
        <div class="modal-content">
          <h3>🎉 下载完成！</h3>
          <p>是否需要对下载的图片进行去水印处理？</p>
          <p class="modal-hint">点击"是"后，请手动点击插件上的<strong>「⚡去水印」</strong>按钮选择文件。</p>
          <label class="modal-checkbox">
            <input type="checkbox" id="dontRemindCheckbox">
            <span>后续不再提醒</span>
          </label>
          <div class="modal-buttons">
            <button id="modalNoBtn" class="modal-btn modal-btn-secondary">否，稍后再说</button>
            <button id="modalYesBtn" class="modal-btn modal-btn-primary">是，我知道了</button>
          </div>
        </div>
      </div>
    </main>

    <!-- API Settings Panel -->
    <div id="apiSettingsPanel" class="modal-panel hidden">
      <div class="panel-header">
        <span>⚙️ API 配置</span>
        <button class="panel-close-btn" data-close="apiSettingsPanel">×</button>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label>API 服务商</label>
          <select id="apiProviderSelect" class="panel-input" style="margin-bottom: 8px;">
            <option value="siliconflow">SiliconFlow (硅基流动)</option>
            <option value="deepseek">DeepSeek Official</option>
            <option value="openai">OpenAI Official</option>
            <option value="custom">自定义...</option>
          </select>
          <label>API 端点 (Base URL)</label>
          <input type="text" id="apiBaseUrl" class="panel-input" placeholder="https://api.siliconflow.cn/v1">
          <div class="input-helper">⚠️ 请务必包含完整的版本后缀 (如 /v1)，插件不再自动补全</div>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <div class="input-with-toggle">
            <input type="password" id="apiKeyInput" class="panel-input" placeholder="sk-xxxxxxxx">
            <button id="toggleApiKey" class="toggle-btn">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>模型</label>
          <select id="apiModelSelect" class="panel-input" style="margin-bottom: 8px;">
            <option value="deepseek-ai/DeepSeek-R1-0528-Qwen3-8B">DeepSeek R1 (Qwen3-8B)</option>
            <option value="THUDM/GLM-4.1V-9B-Thinking">GLM-4.1V-9B-Thinking (多模态)</option>
            <option value="custom">自定义...</option>
          </select>
          <input type="text" id="apiModel" class="panel-input" placeholder="自定义模型名称">
        </div>
        <div class="panel-actions">
          <button id="importConfigBtn" class="panel-btn-secondary">导入配置</button>
          <button id="exportConfigBtn" class="panel-btn-secondary">导出配置</button>
          <button id="saveApiSettingsBtn" class="panel-btn-primary">保存设置</button>
        </div>
        <input type="file" id="importConfigFile" accept=".json" style="display: none;">
      </div>
    </div>

    <!-- Prompt Library Panel -->
    <div id="promptLibraryPanel" class="modal-panel hidden">
      <div class="panel-header">
        <span>📚 提示词库</span>
        <div class="panel-header-actions">
          <button id="importLibraryBtn" class="panel-header-btn">导入</button>
          <button id="exportLibraryBtn" class="panel-header-btn">导出</button>
          <button id="clearLibraryBtn" class="panel-header-btn danger">清空</button>
        </div>
        <button class="panel-close-btn" data-close="promptLibraryPanel">×</button>
      </div>
      <div class="panel-body">
        <div class="search-bar">
          <input type="text" id="librarySearchInput" class="panel-input" placeholder="🔍 搜索文本或 #标签...">
        </div>
        <div id="libraryList" class="library-list">
          <div class="empty-state">暂无保存的提示词</div>
        </div>
        <input type="file" id="importLibraryFile" accept=".json" style="display: none;">
      </div>
    </div>

    <!-- Tag Input Panel -->
    <div id="tagInputPanel" class="modal-panel small hidden">
      <div class="panel-header">
        <span>💾 保存提示词</span>
        <button class="panel-close-btn" data-close="tagInputPanel">×</button>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label>添加标签 (用逗号分隔)</label>
          <input type="text" id="tagInputField" class="panel-input" placeholder="风格, 人物, 场景">
          <div id="tagSuggestions" class="suggestions-list hidden"></div>
        </div>
        <div class="panel-actions">
          <button id="cancelSavePrompt" class="panel-btn-secondary">取消</button>
          <button id="confirmSavePrompt" class="panel-btn-primary">保存</button>
        </div>
      </div>
    </div>

    <!-- Footer Area (Relative) -->
    <footer id="dynamicFooter" class="footer-area">
      <div class="qr-section">
        <img id="footerQrImg" src="images/qr.webp" alt="Join Group" class="qr-code">
        <div class="qr-info">
          <!-- Text Area: Fixed + Dynamic -->
          <div class="qr-text-group">
            <span id="staticFooterText" class="qr-text-large">扫码加微会拉你进群（暗号：大香蕉）</span>
            <span id="footerText" class="qr-text-large" style="margin-top: 2px; color: var(--accent-gold);"></span>
          </div>

          <!-- Links Area -->
          <div class="link-group">
            <a id="footerLink" href="https://gt.topgpt.us/" target="_blank" class="website-link-large"
              style="color: #ffeb3b; font-weight: 700;">🌍收藏我的博客获取更多AI经验与工具</a>
            <a id="footerLink2" href="#" target="_blank" class="website-link-large hidden"></a>
            <a id="footerLink3" href="#" target="_blank" class="website-link-large hidden"
              style="color: #ffffff; font-weight: 700;"></a>
          </div>
        </div>
      </div>
      <!-- Pagination Dots -->
      <div id="footerPaginationDots" class="footer-pagination-dots"></div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
